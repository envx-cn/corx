# Deploy corx to Cloudflare Workers — manual trigger only (Actions → Deploy →
# Run workflow). Nothing deploys on merge; the workflow is started by hand so a
# push to `main` can never reach production on its own. Merges are still gated
# by `verify.yml`, which runs on every push and pull request.
#
# Needs two values on the `envx-cn` org (see README → Setup):
#   secret CF_WORKER_TOKEN  → exported as CLOUDFLARE_API_TOKEN
#                             (Account: Workers Scripts:Edit, Account Settings:Read,
#                              D1:Edit; Zone: Workers Routes:Edit + Zone:Read once
#                              a custom domain/route is attached)
#   variable CF_ACCOUNT_ID  → exported as CLOUDFLARE_ACCOUNT_ID
# Org-level secrets/vars must be granted to this repository (Settings → Secrets
# and variables → Actions → Repository access), otherwise they arrive empty and
# the "Check credentials" step fails loudly instead of deploying nowhere.
#
# Worker secrets (ADMIN_TOKEN, PROXY_ZONE, ACCESS_*, PUBLIC_KEY, …) are NOT
# passed here: they live on the Worker, survive every deploy, and are inherited
# by it. Only the two credentials above are needed to talk to the API.
#
# D1 migrations run before every deploy (wrangler skips already-applied ones, so
# it is a no-op on most runs). Use the `skip_migrations` input when you need to
# ship code without touching the database.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: Skip D1 migrations (deploy code only)
        type: boolean
        default: false

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  # The same gate PRs run (typecheck, tests, contrast, build) — one definition,
  # so the manual deploy can never drift from what a merge had to pass.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: build + deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gives this workflow its own deploy history, and a place to add required
    # reviewers later. Remove if the org policy blocks environments.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Distinguishes "org secret not granted to this repo" (empty value) from a
      # rejected token, which is otherwise a confusing 10000 error during deploy.
      - name: Check credentials
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CF_WORKER_TOKEN is empty — grant the org secret to envx-cn/corx}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID is empty — grant the org variable to envx-cn/corx}"
      - name: Who am I
        continue-on-error: true
        run: npx wrangler whoami

      - name: Build
        run: npm run build

      # Idempotent: wrangler only applies what the remote database hasn't seen.
      # Non-interactive in CI (it skips the confirmation prompt).
      - name: Apply D1 migrations
        if: ${{ inputs.skip_migrations != true }}
        run: npm run db:migrate

      - name: Deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log

      - name: Summary
        if: always()
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log 2>/dev/null | head -1)
          version=$(grep -oE 'Current Version ID: [0-9a-f-]+' /tmp/deploy.log 2>/dev/null | head -1)
          {
            echo "### corx deploy"
            echo
            echo "- ${url:-worker URL not found in wrangler output}"
            echo "- ${version:-version id not found in wrangler output}"
            echo "- commit \`${GITHUB_SHA:0:7}\` · migrations: ${{ inputs.skip_migrations && 'skipped' || 'applied' }}"
          } >> "$GITHUB_STEP_SUMMARY"
